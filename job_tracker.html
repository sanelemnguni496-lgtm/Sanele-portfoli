<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerTrack | Job Application Tracker</title><style>:root{font-family:Inter,system-ui,Arial;color:#18243a;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:#161e42;color:white;padding:24px max(5%,20px)}header h1{margin:0;font-size:27px}header p{color:#c9d1f0;margin:7px 0 0}main{max-width:1100px;margin:25px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat,.card{background:white;border-radius:18px;padding:20px;box-shadow:0 8px 24px #15264a0a}.stat strong{display:block;font-size:30px;color:#4b49c7}.stat small{color:#64748b}.layout{display:grid;grid-template-columns:350px 1fr;gap:20px}h2{margin:0 0 16px;font-size:21px}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #d9dfed;border-radius:10px;padding:11px;font:inherit}textarea{resize:vertical}button{border:0;border-radius:10px;padding:11px 15px;background:#5353d5;color:white;font-weight:700;cursor:pointer;margin-top:14px}.outline{background:#edf0ff;color:#393da0}.danger{background:#fff0f1;color:#bb304b}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{flex:1}.toolbar select{width:160px}.item{border:1px solid #e3e8f2;border-radius:14px;padding:15px;margin-bottom:12px}.itemhead{display:flex;justify-content:space-between;align-items:start;gap:10px}.item h3{margin:0 0 5px}.muted{color:#6d7990;font-size:13px}.badge{background:#e8f2ff;color:#235eaa;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}.actions button{margin:10px 8px 0 0;font-size:12px}.empty{text-align:center;padding:36px;color:#66758c}.note{color:#65738c;font-size:12px;margin-top:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{flex-wrap:wrap}.toolbar select{width:100%}}</style></head><body><header><h1>✦ CareerTrack</h1><p>Sanele Bridgette Mnguni · Software Developer Job Application Tracker</p></header><main><div class="stats"><div class="stat"><strong id="total">0</strong><small>Total applications</small></div><div class="stat"><strong id="applied">0</strong><small>Applied</small></div><div class="stat"><strong id="interviews">0</strong><small>Interviews</small></div><div class="stat"><strong id="offers">0</strong><small>Offers</small></div></div><div class="layout"><section class="card"><h2 id="formTitle">Add an application</h2><form id="form"><label>Company</label><input id="company" required maxlength="80" placeholder="Company name"><label>Position</label><input id="role" required maxlength="100" placeholder="Junior Software Developer"><label>Date applied</label><input id="date" type="date" required><label>Status</label><select id="status"><option>Wishlist</option><option selected>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select><label>Notes</label><textarea id="notes" rows="3" maxlength="500" placeholder="Interview dates, contacts, follow-ups..."></textarea><button id="save" type="submit">Save application</button><button id="cancel" class="outline" type="button" hidden>Cancel edit</button></form><p class="note">Entries are private to this browser and saved on this device. No account or server required.</p></section><section class="card"><h2>My applications</h2><div class="toolbar"><input id="search" placeholder="Search company or role"><select id="filter"><option value="All">All statuses</option><option>Wishlist</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></div><div id="list"></div></section></div></main><script>const key='sanele_careertrack_v1';let applications=[];try{applications=JSON.parse(localStorage.getItem(key))||[]}catch{}let editing=null;const ids=['company','role','date','status','notes'];const el=id=>document.getElementById(id);el('date').value=new Date().toISOString().slice(0,10);function save(){localStorage.setItem(key,JSON.stringify(applications))}function clearForm(){editing=null;el('form').reset();el('date').value=new Date().toISOString().slice(0,10);el('formTitle').textContent='Add an application';el('save').textContent='Save application';el('cancel').hidden=true}function render(){el('total').textContent=applications.length;el('applied').textContent=applications.filter(x=>x.status==='Applied').length;el('interviews').textContent=applications.filter(x=>x.status==='Interview').length;el('offers').textContent=applications.filter(x=>x.status==='Offer').length;const q=el('search').value.toLowerCase(),f=el('filter').value;const items=applications.filter(x=>(x.company+' '+x.role).toLowerCase().includes(q)&&(f==='All'||x.status===f));const box=el('list');box.replaceChildren();if(!items.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='No applications found. Add your first opportunity!';box.append(empty)}items.forEach(x=>{const item=document.createElement('article');item.className='item';const head=document.createElement('div');head.className='itemhead';const left=document.createElement('div');const title=document.createElement('h3');title.textContent=x.role;const co=document.createElement('div');co.className='muted';co.textContent=x.company+' · '+x.date;left.append(title,co);const badge=document.createElement('span');badge.className='badge';badge.textContent=x.status;head.append(left,badge);item.append(head);if(x.notes){const p=document.createElement('p');p.className='muted';p.textContent=x.notes;item.append(p)}const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='outline';edit.textContent='Edit';edit.onclick=()=>{editing=x.id;ids.forEach(k=>el(k).value=x[k]);el('formTitle').textContent='Edit application';el('save').textContent='Update application';el('cancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this application?')){applications=applications.filter(a=>a.id!==x.id);save();render();if(editing===x.id)clearForm()}};actions.append(edit,del);item.append(actions);box.append(item)})}el('form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(ids.map(k=>[k,el(k).value.trim()]));if(!values.company||!values.role||!values.date)return;if(editing){applications=applications.map(x=>x.id===editing?{...x,...values}:x)}else{applications.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...values})}save();clearForm();render()};el('cancel').onclick=clearForm;el('search').oninput=render;el('filter').onchange=render;render();</script></body></html>
